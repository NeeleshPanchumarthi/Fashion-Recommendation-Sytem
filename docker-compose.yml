# API:     docker compose up --build
# Worker:  docker compose --profile ingestion run --rm worker [--max-batches 2]
services:
  api:
    build: .
    image: fashion-search:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/home/app/.cache/huggingface
    restart: unless-stopped

  worker:
    image: fashion-search:latest
    build: .
    env_file: .env
    entrypoint: ["python", "-m", "workers.ingestion_worker"]
    command: []
    volumes:
      - ./data:/app/data            # dataset in, checkpoints out
      - model-cache:/home/app/.cache/huggingface
    profiles: ["ingestion"]         # never started by a plain `docker compose up`

volumes:
  model-cache:
